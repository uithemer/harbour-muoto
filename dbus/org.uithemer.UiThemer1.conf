<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
                           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
    System-bus policy for org.uithemer.UiThemer1.

    Root is the only uid allowed to own
    the well-known name (this is what the daemon registers as), and every
    other client (context="default") may send to the daemon, but only on
    the well-known interfaces we expose plus the standard DBus Introspect /
    Peer / Properties machinery. On a single-user Sailfish device the bus
    policy IS the authorization gate; there is no polkit hand-off and no
    auth_admin prompt.

    Note: we used to constrain sends to `user="defaultuser"`, but the
    username-based match is fragile across SFOS variants (older releases
    shipped `nemo`). context="default" matches every uid except those
    with their own explicit <policy user="..."> stanza, which is exactly
    what we want here.
-->
<busconfig>
  <policy user="root">
    <allow own="org.uithemer.UiThemer1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.uithemer.UiThemer1"
           send_interface="org.uithemer.UiThemer1.Themes"/>
    <allow send_destination="org.uithemer.UiThemer1"
           send_interface="org.uithemer.UiThemer1.Packs"/>
    <allow send_destination="org.uithemer.UiThemer1"
           send_interface="org.uithemer.UiThemer1.SystemServices"/>
    <allow send_destination="org.uithemer.UiThemer1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.uithemer.UiThemer1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.uithemer.UiThemer1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
