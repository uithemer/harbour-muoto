<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
                           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
    System-bus policy for org.uithemer.UiThemer1.

    - Only root may own (i.e. register) the well-known name; this is
      what the daemon runs as.
    - defaultuser may send messages to the daemon; this is the user the
      Sailfish GUI runs as. Real authorization is performed inside the
      daemon via libpolkit-qt-core-1 against the 3 polkit actions defined
      in org.uithemer.policy, so the bus policy intentionally stays
      permissive at the transport layer.
-->
<busconfig>
  <policy user="root">
    <allow own="org.uithemer.UiThemer1"/>
    <allow send_destination="org.uithemer.UiThemer1"/>
  </policy>
  <policy user="defaultuser">
    <allow send_destination="org.uithemer.UiThemer1"/>
  </policy>
</busconfig>
